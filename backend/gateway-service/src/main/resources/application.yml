server:
  port: ${SERVICE_PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/system/**
          filters: &strip-api-prefix
            - StripPrefix=2
        - id: breeding-route
          uri: lb://breeding-service
          predicates:
            - Path=/api/v1/breeding/**
          filters:
            - StripPrefix=3
        - id: slaughter-route
          uri: lb://slaughter-service
          predicates:
            - Path=/api/v1/slaughter/**
          filters: *strip-api-prefix
        - id: distribution-route
          uri: lb://distribution-service
          predicates:
            - Path=/api/v1/distribution/**
          filters: *strip-api-prefix
        - id: sales-route
          uri: lb://sales-service
          predicates:
            - Path=/api/v1/sales/**
          filters: *strip-api-prefix
        - id: trace-route
          uri: lb://trace-service
          predicates:
            - Path=/api/v1/trace/**,/api/v1/consumer/**,/api/v1/dashboard/**,/api/v1/notification/**
          filters: *strip-api-prefix
        - id: blockchain-route
          uri: lb://blockchain-service
          predicates:
            - Path=/api/v1/blockchain/**
          filters: *strip-api-prefix
        - id: file-route
          uri: lb://file-service
          predicates:
            - Path=/api/v1/file/**
          filters: *strip-api-prefix
        # 设备/第三方系统自动录入统一入口：设备只认这一层，换协议/加设备型号只改接入服务
        - id: ingest-route
          uri: lb://ingest-service
          predicates:
            - Path=/api/v1/ingest/**
          filters: *strip-api-prefix
        # 智能助手：只读问答。走登录态（不设白名单），身份头由网关统一注入，
        # 保证「养殖户只能问自家猪」这件事和页面口径一致。
        - id: agent-route
          uri: lb://agent-service
          predicates:
            - Path=/api/v1/agent/**
          filters: *strip-api-prefix
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: '*'
            allow-credentials: true
      # 下游服务（common-web WebMvcConfig）也会加一份 CORS 头，网关再叠加就变成
      # 「Access-Control-Allow-Origin: a, a」，浏览器直接判定跨域失败。
      # 这里去重只留第一份：网关有配置就以网关为准。
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Local Redis is intentionally passwordless. The Docker profile below
      # enables authentication from REDIS_PASSWORD.
      #password: 123456
      database: ${REDIS_DATABASE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      password: ${REDIS_PASSWORD:}
