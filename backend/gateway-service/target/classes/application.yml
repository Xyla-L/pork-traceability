server:
  port: 8089
debug: true
spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      # 路由规则：根据路径前缀转发到对应服务
      routes:
        # 认证服务
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # 养殖服务
        - id: breeding-route
          uri: lb://breeding-service
          predicates:
            - Path=/api/breeding/**

        # 屠宰服务
        - id: slaughter-route
          uri: lb://slaughter-service
          predicates:
            - Path=/api/slaughter/**

        # 分割配送服务
        - id: distribution-route
          uri: lb://distribution-service
          predicates:
            - Path=/api/distribution/**

        # 销售服务
        - id: sales-route
          uri: lb://sales-service
          predicates:
            - Path=/api/sales/**

        # 追溯服务
        - id: trace-route
          uri: lb://trace-service
          predicates:
            - Path=/api/trace/**

      # 跨域配置（开发阶段前端联调用）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true


  # Redis 配置（Sa-Token用）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false