server:
  port: ${SERVICE_PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/system/**
          filters: &strip-api-prefix
            - StripPrefix=2
        - id: breeding-route
          uri: lb://breeding-service
          predicates:
            - Path=/api/v1/breeding/**
          filters:
            - StripPrefix=3
        - id: slaughter-route
          uri: lb://slaughter-service
          predicates:
            - Path=/api/v1/slaughter/**
          filters: *strip-api-prefix
        - id: distribution-route
          uri: lb://distribution-service
          predicates:
            - Path=/api/v1/distribution/**
          filters: *strip-api-prefix
        - id: sales-route
          uri: lb://sales-service
          predicates:
            - Path=/api/v1/sales/**
          filters: *strip-api-prefix
        - id: trace-route
          uri: lb://trace-service
          predicates:
            - Path=/api/v1/trace/**,/api/v1/consumer/**,/api/v1/dashboard/**,/api/v1/notification/**
          filters: *strip-api-prefix
        - id: blockchain-route
          uri: lb://blockchain-service
          predicates:
            - Path=/api/v1/blockchain/**
          filters: *strip-api-prefix
        - id: file-route
          uri: lb://file-service
          predicates:
            - Path=/api/v1/file/**
          filters: *strip-api-prefix
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: '*'
            allow-credentials: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
