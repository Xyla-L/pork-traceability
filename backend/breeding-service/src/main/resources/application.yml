server:
  port: ${SERVICE_PORT:8082}
spring:
  application:
    name: breeding-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_breeding?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Local Redis is intentionally passwordless. The Docker profile below
      # enables authentication from REDIS_PASSWORD.
      #password:
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除字段不再全局指定（原为 deleted）：现由各实体的 @TableLogic 显式声明 void_flag，
      # 避免「一个隐式全局配置 + 一个实体注解」两套规则并存导致的过滤行为不可预期
      logic-delete-value: 1
      logic-not-delete-value: 0
# 机构登记同步：养殖场档案增改删后，把机构同步到 auth-service 的 sys_org（机构管理的数据源）
services:
  auth-url: ${SERVICES_AUTH_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      password: ${REDIS_PASSWORD:}
