server:
  port: 8084
spring:
  application:
    name: distribution-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_distribution?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Local Redis is intentionally passwordless. The Docker profile below
      # enables authentication from REDIS_PASSWORD.
      #password:
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 下游服务地址（容器内由 compose 的 SERVICES_* 环境变量覆盖）
services:
  # 召回收运签收后把召回单收口为「已完成」——恢复执行状态的写入口在销售服务
  sales-url: ${SALES_SERVICE_URL:http://localhost:8085}
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}

# 装车口（LOAD 通道）的口径参数
ingest:
  load:
    # 「同一趟车继续装」的并入窗口（分钟）：同一车牌在这段时间内再次扫码，
    # 视为同一趟车在继续装货 → 把这批货追加到那张**还没发车**的运单上，而不是再开一张。
    # 窗口之外不并 —— 隔了很久还挂着的「待发车」是异常滞留，硬并进去等于替人认定它是活单。
    merge-window-minutes: 120
  split-snapshot:
    # 每台监控相机保留的快照张数上限（滚动窗口）：相机分钟级上报，本地盘不能无限涨。
    # 超过即把最老的连同文件一起淘汰；页面展示的是最近 10 张，这里留两倍余量。
    retention: 20

# 冷链温度定时采集：发车后按固定间隔自动存一条读数，全部站点到达即停（不再扫 status≠2 的运单）
distribution:
  temperature:
    auto-sample:
      # 真机探头接入前，由模拟探头按间隔产生读数（source=SIMULATED，页面单独标注）。
      # 某张运单一旦有真机上报（source=DEVICE），本采集器自动对该运单停手，不混数据。
      enabled: true
      # 采样间隔（秒）：300 秒 = 5 分钟，冷链运输常规频率
      interval-seconds: 300
      # 扫描频率（毫秒）：30 秒看一次哪些车「到点了」，真正落库仍按 interval-seconds
      scan-interval-ms: 30000

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      password: ${REDIS_PASSWORD:}
