server:
  port: ${SERVICE_PORT:8086}
spring:
  application:
    name: trace-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Local Redis is intentionally passwordless. The Docker profile below
      # enables authentication from REDIS_PASSWORD.
      #password:
      database: ${REDIS_DATABASE:0}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
services:
  breeding-url: ${BREEDING_SERVICE_URL:http://localhost:8082}
  slaughter-url: ${SLAUGHTER_SERVICE_URL:http://localhost:8083}
  distribution-url: ${DISTRIBUTION_SERVICE_URL:http://localhost:8084}
  sales-url: ${SALES_SERVICE_URL:http://localhost:8085}
  blockchain-url: ${BLOCKCHAIN_SERVICE_URL:http://localhost:8087}
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      password: ${REDIS_PASSWORD:}
