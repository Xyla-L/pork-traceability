server:
  port: 8087
spring:
  application:
    name: blockchain-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
        default-requeue-rejected: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Local Redis is intentionally passwordless. The Docker profile below
      # enables authentication from REDIS_PASSWORD.
      #password:
      database: ${REDIS_DATABASE:0}
blockchain:
  # local=数据库模拟账本（开发调试用）；evm=真实上链（EVM 兼容链）
  type: ${BLOCKCHAIN_TYPE:local}
  evm:
    # 本地 Ganache 默认 http://localhost:8545；Sepolia 测试网可用 https://rpc.sepolia.org
    rpc-url: ${EVM_RPC_URL:http://localhost:8545}
    # Ganache 默认 1337；Sepolia 为 11155111
    chain-id: ${EVM_CHAIN_ID:1337}
    # 上链账户私钥；本地可用 Ganache 确定性账户，测试网请配置环境变量
    private-key: ${EVM_PRIVATE_KEY:}
    # 已部署合约地址；留空则启动时自动部署（自动部署地址会打印在日志中）
    contract-address: ${EVM_CONTRACT_ADDRESS:}
    gas-limit: ${EVM_GAS_LIMIT:2000000}
    deploy-gas-limit: ${EVM_DEPLOY_GAS_LIMIT:4000000}
    # 区块浏览器地址（如 http://localhost:8545 无浏览器则留空）；有值时页面才给「在链上查看」链接
    explorer-url: ${EVM_EXPLORER_URL:}
  # 存证对账：启动 60 秒后体检一次，之后每小时一次（间隔毫秒）
  reconcile-initial-delay-ms: ${CHAIN_RECONCILE_INITIAL_DELAY_MS:60000}
  reconcile-interval-ms: ${CHAIN_RECONCILE_INTERVAL_MS:3600000}
  # 重试补偿间隔（毫秒），失败记录 1 分钟后才会被重扫
  retry-interval-ms: ${CHAIN_RETRY_INTERVAL_MS:300000}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      password: ${REDIS_PASSWORD:}
