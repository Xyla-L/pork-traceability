name: pork-traceability

x-app-environment: &app-environment
  # 容器默认 UTC，会导致 LocalDateTime.now() 等业务时间偏差 8 小时，统一设为上海时区
  TZ: Asia/Shanghai
  NACOS_ADDR: nacos:8848
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
  # Nacos 配置中心地址（spring.config.import 需要，不设则默认 127.0.0.1 导致健康检查 DOWN）
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_ADDR:-nacos:8848}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-this-redis-password}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-pork}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-this-rabbit-password}
  DB_USERNAME: ${DB_USERNAME:-pork_user}
  DB_PASSWORD: ${DB_PASSWORD:-123456}
  JWT_SECRET: ${JWT_SECRET:-pork-traceability-secret-key-2026}
  SPRING_PROFILES_ACTIVE: docker
  BREEDING_SERVICE_URL: http://breeding-service:8082
  SLAUGHTER_SERVICE_URL: http://slaughter-service:8083
  DISTRIBUTION_SERVICE_URL: http://distribution-service:8084
  SALES_SERVICE_URL: http://sales-service:8085
  BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8087
  # @Value("${services.xxx-url}") 形式的客户端（sales/distribution/slaughter）按此命名解析
  SERVICES_BREEDING_URL: http://breeding-service:8082
  SERVICES_SLAUGHTER_URL: http://slaughter-service:8083
  SERVICES_DISTRIBUTION_URL: http://distribution-service:8084
  SERVICES_SALES_URL: http://sales-service:8085
  SERVICES_BLOCKCHAIN_URL: http://blockchain-service:8087
  # 接入层核对接种凭证 fileId 真实性时调用（只查元信息，不拉文件内容）
  SERVICES_FILE_URL: http://file-service:8088
  # 机构登记同步用（breeding → auth 的 /auth/internal/orgs，容器内直连，网关不转发）
  AUTH_SERVICE_URL: http://auth-service:8081
  SERVICES_AUTH_URL: http://auth-service:8081
  # 智能助手只读取数：追溯问答走 trace，异常诊断走 ingest
  SERVICES_TRACE_URL: http://trace-service:8086
  SERVICES_INGEST_URL: http://ingest-service:8089
  # 模型：默认智谱免费模型 glm-4-flash；不填 key 则走本地归纳，不产生任何调用费用
  AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
  AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
  AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-glm-4-flash}
  # 空=不传该字段；通义千问设 false 可关闭思考、显著缩短等待
  AGENT_LLM_ENABLE_THINKING: ${AGENT_LLM_ENABLE_THINKING:-}

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [pork-net]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    nacos: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVICE_PORT}/actuator/health | grep -q UP"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 45s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    ports: ["3307:3306"]
    networks: [pork-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-this-redis-password}"]
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    networks: [pork-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-this-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-pork}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-this-rabbit-password}
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    ports: ["5672:5672", "15672:15672"]
    networks: [pork-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  nacos:
    image: nacos/nacos-server:v2.4.3
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports: ["8848:8848", "9848:9848"]
    networks: [pork-net]
    healthcheck:
      # Nacos 是 Java 进程，容器「已启动」远早于「可服务」：8848(HTTP) 与 9848(gRPC) 前者先监听，
      # 客户端真正依赖的是 9848。只探测 8848 会让服务在 9848 未就绪时注册失败（NacosException:
      # Client not connected），因此两个端口都必须通才算就绪。
      test: ["CMD-SHELL", "bash -c 'curl -fsS http://localhost:8848/nacos/v1/console/health/readiness >/dev/null && echo > /dev/tcp/localhost/9848'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: gateway-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.gateway.GatewayApplication
      SERVICE_PORT: 8080
    ports: ["8080:8080"]

  auth-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: auth-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.auth.AuthApplication
      SERVICE_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}

  breeding-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: breeding-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.breeding.BreedingApplication
      SERVICE_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/db_breeding?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  slaughter-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: slaughter-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.slaughter.SlaughterApplication
      SERVICE_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/db_slaughter?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SLAUGHTERHOUSE_NAME: ${SLAUGHTERHOUSE_NAME:-默认定点屠宰场}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  distribution-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: distribution-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.distribution.DistributionApplication
      SERVICE_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/db_distribution?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  sales-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: sales-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.sales.SalesApplication
      SERVICE_PORT: 8085
      DB_URL: jdbc:mysql://mysql:3306/db_sales?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  trace-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: trace-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.trace.TraceServiceApplication
      SERVICE_PORT: 8086
      DB_URL: jdbc:mysql://mysql:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

  # 设备/第三方系统接入层：设备只认这一个入口，校验通过后再调业务服务写库
  ingest-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: ingest-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.ingest.IngestApplication
      SERVICE_PORT: 8089
      DB_URL: jdbc:mysql://mysql:3306/db_ingest?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      INGEST_TEMP_MIN: ${INGEST_TEMP_MIN:--18.0}
      INGEST_TEMP_MAX: ${INGEST_TEMP_MAX:-0.0}
      INGEST_TEMP_INTERVAL: ${INGEST_TEMP_INTERVAL:-60}

  ganache:
    image: trufflesuite/ganache:v7.9.2
    restart: unless-stopped
    # dbPath 落盘：链上数据与已部署合约要能跨容器重启存活，否则每次重启合约地址就变了
    # blockTime 0 = 交易即时出块（演练/演示环境不需要 2 秒出块，迁移几百条时差别是几十分钟）
    command: --chain.chainId 1337 --wallet.deterministic --miner.blockTime 0 --database.dbPath /data
    volumes:
      - ganache-data:/data
    ports: ["8545:8545"]
    networks: [pork-net]
    healthcheck:
      # ganache 镜像无 wget/curl，改用 bash 的 /dev/tcp 探测 RPC 端口是否监听
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8545) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  blockchain-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: blockchain-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.blockchain.BlockchainApplication
      SERVICE_PORT: 8087
      DB_URL: jdbc:mysql://mysql:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      # local=数据库模拟账本；evm=真实上链到本地 Ganache（2026-11-08 已切，历史 962 条已补写链上）
      BLOCKCHAIN_TYPE: ${BLOCKCHAIN_TYPE:-evm}
      EVM_RPC_URL: ${EVM_RPC_URL:-http://ganache:8545}
      EVM_CHAIN_ID: ${EVM_CHAIN_ID:-1337}
      # Ganache --wallet.deterministic 首个账户（仅本地开发链，勿用于公网）
      EVM_PRIVATE_KEY: ${EVM_PRIVATE_KEY:-0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d}
      # 合约地址固定：ganache 数据已落卷（ganache-data），重启后合约仍在；换链/清卷时才需要改
      EVM_CONTRACT_ADDRESS: ${EVM_CONTRACT_ADDRESS:-0xe78a0f7e598cc8b0bb87894b0f60dd2a88d6a8ab}
      # 存证对账出问题时推管理员收件箱（trace 通知中心内部接口）
      SERVICES_TRACE_URL: http://trace-service:8086
      # 本地 ganache 即时出块，回执 300ms 就够；默认 2s 会让批量补写历史存证慢一个数量级
      SPRING_APPLICATION_JSON: '{"blockchain":{"evm":{"receipt-interval-ms":300}}}'
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ganache: { condition: service_healthy }

  file-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: file-service }
    environment:
      <<: *app-environment
      MAIN_CLASS: com.pork.file.FileApplication
      SERVICE_PORT: 8088
      DB_URL: jdbc:mysql://mysql:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      FILE_STORAGE_ROOT: /app/data/trace-files
    volumes: ["${FILE_STORAGE_PATH:-./data/trace-files}:/app/data/trace-files"]

  # 智能助手（内嵌实验室 Dify / 千问）。模型在实验室内网，
  # 经宿主机 SSH 隧道暴露到 127.0.0.1:9090，容器内用 host.docker.internal 访问。
  # Key 走 .env.ai（已 gitignore），不写进任何被 Git 跟踪的文件。
  ai-service:
    <<: *app-defaults
    build:
      context: .
      args: { SERVICE: ai-service }
    environment:
      <<: *app-environment
      # ai-service 的 pom 开启了 spring-boot repackage（为了支持 mvn spring-boot:run），
      # 产出的是可执行 fat jar（类在 BOOT-INF/classes 下），所以入口用 JarLauncher，
      # 不能像其他服务那样直接指定 Application 类。
      MAIN_CLASS: org.springframework.boot.loader.launch.JarLauncher
      SERVICE_PORT: 8089
      TRACE_SERVICE_URL: http://trace-service:8086
      # 模型入口走同网络的 dify-tunnel 容器（容器内建 SSH 隧道），不再依赖宿主机 9090
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://dify-tunnel:9090}
      # DIFY_API_KEY 只从 env_file(.env.ai) 注入；这里不能再写 ${DIFY_API_KEY:-}，
      # 否则空串会覆盖 env_file 里的真值（踩过）。
      DIFY_TIMEOUT: ${DIFY_TIMEOUT:-120}
    env_file: [".env.ai"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      nacos: { condition: service_healthy }
      trace-service: { condition: service_started }
      dify-tunnel: { condition: service_started }

  # 实验室 Dify / 千问的 SSH 隧道（本机 → frp 跳板 → 实验室内网 172.17.102.191:80）。
  # 隧道放在容器里跑：密钥目录由 SSH_KEY_DIR 指定（写进 .env.ai，不进 Git），
  # 省掉「每台机器都要配 ~/.ssh/config、还要手动双击 bat」这一步。
  # 隧道起不来只会让 AI 面板报不可达，不影响其他服务；参数见 .env.ai。
  dify-tunnel:
    image: alpine:3.20
    container_name: pork-traceability-dify-tunnel
    restart: unless-stopped
    networks: [pork-net]
    volumes:
      # 只读挂载私钥目录；默认 ~/.ssh，Windows 下在 .env.ai 里写绝对路径
      - "${SSH_KEY_DIR:-~/.ssh}:/keys:ro"
    environment:
      JUMP_HOST: ${DIFY_JUMP_HOST:-frp-use.com}
      JUMP_PORT: ${DIFY_JUMP_PORT:-50480}
      JUMP_USER: ${DIFY_JUMP_USER:-74276}
      JUMP_KEY: ${DIFY_JUMP_KEY:-id_rsa}
      LAB_HOST: ${DIFY_LAB_HOST:-172.17.102.191}
      LAB_USER: ${DIFY_LAB_USER:-xm}
      LAB_KEY: ${DIFY_LAB_KEY:-id_ed25519}
    # 挂载进来的私钥权限是 0644（宿主 Windows 改不动），ssh 会以「bad permissions」拒用，
    # 所以先复制到 /tmp 再 chmod 600。$$ 是 compose 的转义，容器里看到的是 $。
    command:
      - /bin/sh
      - -c
      - |
        set -e
        # alpine 默认的 dl-cdn 源在本机容器网络里基本拉不动（一直卡住），换阿里云源
        printf 'https://mirrors.aliyun.com/alpine/v3.20/main\nhttps://mirrors.aliyun.com/alpine/v3.20/community\n' > /etc/apk/repositories
        apk add --no-cache openssh-client >/dev/null
        mkdir -p /tmp/k
        cp "/keys/$$JUMP_KEY" /tmp/k/jump
        cp "/keys/$$LAB_KEY" /tmp/k/lab
        chmod 600 /tmp/k/jump /tmp/k/lab
        echo "[tunnel] $$LAB_USER@$$LAB_HOST <- $$JUMP_USER@$$JUMP_HOST:$$JUMP_PORT"
        exec ssh -N -g \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o ExitOnForwardFailure=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=3 \
          -i /tmp/k/lab \
          -o "ProxyCommand=ssh -p $$JUMP_PORT -i /tmp/k/jump -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -W %h:%p $$JUMP_USER@$$JUMP_HOST" \
          -L 0.0.0.0:9090:localhost:80 $$LAB_USER@$$LAB_HOST

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      # 管理端构建产物：80 端口直接打开 web-admin，无需再跑 Vite dev server
      - "../web-admin/dist:/usr/share/nginx/html/admin:ro"
    ports: ["80:80"]
    networks: [pork-net]
    depends_on:
      gateway-service: { condition: service_healthy }
    healthcheck:
      # 必须用 127.0.0.1：容器内 localhost 会先解析到 ::1，而 nginx.conf 只 listen 了 IPv4 的 80，
      # 用 localhost 探测会一直 Connection refused，nginx 永远停在 unhealthy。
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  pork-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  ganache-data:
