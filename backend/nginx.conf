events { worker_connections 1024; }

http {
    # 静态资源的 MIME 映射必须引入，否则 .js 会按默认 text/plain 下发，
    # 浏览器按严格 MIME 校验拒绝执行 module script，管理端整站白屏
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        client_max_body_size 52m;

        # 管理端静态站点（web-admin 构建产物，history 路由需回退到 index.html）
        location / {
            root /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 入口页绝不缓存：每次重新构建都换了带 hash 的资源名，只要 index.html 拿到新的就不会用旧界面。
        # 之前一直复用旧界面（改名后侧边栏还是旧名字），就是因为浏览器把 index.html 缓存住了。
        location = /index.html {
            root /usr/share/nginx/html/admin;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 带 hash 的静态资源可以长期缓存：内容变了文件名必定跟着变，不存在拿到旧代码的可能
        location /assets/ {
            root /usr/share/nginx/html/admin;
            # 只给这一条：expires 会再塞一个 max-age，两个 Cache-Control 并存没意义
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location /api/v1/ {
            # 使用 Docker 内置 DNS 动态解析 gateway-service，
            # 避免网关容器重建换 IP 后 nginx 仍连旧地址导致 502
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $gateway_upstream http://gateway-service:8080;
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 上游是 HTTP/1.1 时，不显式清空 Connection 的话 Nginx 会带 close，
            # 网关侧的长连接（尤其是 SSE）会被提前掐断
            proxy_set_header Connection "";
        }

        # ============================================================
        # AI 助手（SSE 流式）—— 必须单独关掉缓冲
        # ------------------------------------------------------------
        # 默认 proxy_buffering on 时，Nginx 会把整个响应收完再发给浏览器，
        # 结果是 18 秒的监管简报在用户眼里"卡 18 秒然后一次性全出来"，
        # 后端逐字吐的流式体验完全失效。
        #
        # proxy_read_timeout 是两次读之间的空闲超时，不是总时长。
        # 这里放到 180s，与 ai-service 的 sse-timeout-millis 对齐，
        # 让后端先超时并优雅收尾，而不是被 Nginx 直接切断。
        # ============================================================
        location /api/v1/ai/ {
            proxy_pass http://gateway-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 关键三行：关缓冲、关缓存、直通分块传输
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
