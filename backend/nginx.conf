events { worker_connections 1024; }

http {
    # 静态资源的 MIME 映射必须引入，否则 .js 会按默认 text/plain 下发，
    # 浏览器按严格 MIME 校验拒绝执行 module script，管理端整站白屏
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        client_max_body_size 52m;

        # 管理端静态站点（web-admin 构建产物，history 路由需回退到 index.html）
        location / {
            root /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/v1/ {
            # 使用 Docker 内置 DNS 动态解析 gateway-service，
            # 避免网关容器重建换 IP 后 nginx 仍连旧地址导致 502
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $gateway_upstream http://gateway-service:8080;
            proxy_pass $gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
