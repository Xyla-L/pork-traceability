server:
  port: 8088
spring:
  application:
    name: file-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_common?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
file:
  storage-root: ${FILE_STORAGE_ROOT:./data/trace-files}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
